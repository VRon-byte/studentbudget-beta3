<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Budget - Log In</title>
  <link rel="stylesheet" href="ttu-nav.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header id="main-header">
    <div class="header-top">
      <div class="brand-link">
        <img src="logo.png" alt="Texas Tech University Double T logo" class="ttu-logo">
        <div class="brand-text">
          <span class="brand-title">TEXAS TECH UNIVERSITY</span>
          <span class="brand-subtitle">Student Budget</span>
        </div>
      </div>
    </div>
  </header>

  <main id="login-main" role="main">
    <section class="login-card" aria-labelledby="login-heading">
      <h1 id="login-heading" class="login-title">TEXAS TECH</h1>
      <p class="login-subtitle">Student Budget</p>

      <form class="login-form" action="homepage/home.html" method="GET">
        <div class="form-group">
          <label for="edu-email">Edu Email</label>
          <input type="email" id="edu-email" name="edu-email" class="form-input" placeholder="student@ttu.edu" required>
        </div>

        <div class="form-group">
          <label for="user-password">Password</label>
          <input type="password" id="user-password" name="user-password" class="form-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" id="login-button" class="btn-primary">Log In</button>
      </form>
    </section>
  </main>

  <footer id="main-footer" role="contentinfo">
    <div class="footer-content">
      <p class="footer-copy">&copy; 2026 Beta3. All rights reserved.</p>
      <ul class="footer-links">
        <li><a href="profilepage/profile.html#help" class="footer-link">Help</a></li>
        <li><a href="profilepage/profile.html#terms" class="footer-link">Terms &amp; Conditions</a></li>
        <li><a href="#main-header" class="footer-link">Back to Top</a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
